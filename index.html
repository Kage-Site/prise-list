<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>dr. peach — Aesthetic Medicine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <div class="app">

    <!-- Shared SVG defs -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
          <stop offset="50%" stop-color="#f3d98b" stop-opacity="1"/>
          <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f6e3a3"/>
          <stop offset="55%" stop-color="#d4af37"/>
          <stop offset="100%" stop-color="#a37e21"/>
        </linearGradient>
        <symbol id="syringeShape" viewBox="0 0 40 140">
          <path d="M20 4V26M12 4H28M20 26L20 108M11 26H29L27 40H13L11 26Z" stroke="#d4af37" stroke-width="2.2" fill="none"/>
          <rect x="14" y="108" width="12" height="10" rx="1.5" stroke="#d4af37" stroke-width="2.2" fill="none"/>
          <path d="M20 118V136" stroke="#d4af37" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M13 50L11 96H29L27 50" stroke="#d4af37" stroke-width="2.2" fill="none"/>
        </symbol>
        <symbol id="lipsShape" viewBox="0 0 64 28">
          <path d="M4 15C13 6 23 4 32 9C41 4 51 6 60 15C51 12 43 18 32 13C21 18 13 12 4 15Z" fill="none" stroke="url(#goldFill)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 15C15 21 24 23 32 17C40 23 49 21 57 15" fill="none" stroke="url(#goldFill)" stroke-width="1.2" stroke-linecap="round"/>
        </symbol>
      </defs>
    </svg>

    <!-- Ambient scattered syringes (below hero, across whole body) -->
    <div class="ambient" aria-hidden="true">
      <div class="syringe" style="--left:6%;  --top:6%;  --w:22px; --op:0.045; --dur:24s; --delay:-2s;  --rot:10deg;  --dx:10px; --dy:-40px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:78%; --top:4%;  --w:18px; --op:0.035; --dur:29s; --delay:-9s;  --rot:-16deg; --dx:-8px; --dy:-34px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:34%; --top:14%; --w:26px; --op:0.05;  --dur:21s; --delay:-4s;  --rot:4deg;   --dx:12px; --dy:-46px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:88%; --top:22%; --w:20px; --op:0.04;  --dur:33s; --delay:-16s; --rot:-8deg;  --dx:-10px; --dy:-38px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:14%; --top:30%; --w:30px; --op:0.06;  --dur:26s; --delay:-11s; --rot:18deg;  --dx:8px; --dy:-50px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:58%; --top:36%; --w:24px; --op:0.038; --dur:19s; --delay:-7s;  --rot:-4deg;  --dx:-12px; --dy:-30px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:4%;  --top:48%; --w:19px; --op:0.05;  --dur:31s; --delay:-19s; --rot:22deg;  --dx:9px; --dy:-42px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:82%; --top:52%; --w:28px; --op:0.045; --dur:23s; --delay:-3s;  --rot:-12deg; --dx:-9px; --dy:-44px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:44%; --top:58%; --w:21px; --op:0.035; --dur:27s; --delay:-13s; --rot:6deg;   --dx:11px; --dy:-36px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:24%; --top:68%; --w:25px; --op:0.055; --dur:20s; --delay:-6s;  --rot:-18deg; --dx:-7px; --dy:-48px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:68%; --top:74%; --w:18px; --op:0.04;  --dur:35s; --delay:-22s; --rot:14deg;  --dx:10px; --dy:-32px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:92%; --top:80%; --w:23px; --op:0.05;  --dur:22s; --delay:-8s;  --rot:-6deg;  --dx:-11px; --dy:-40px;"><svg><use href="#syringeShape"/></svg></div>
      <div class="syringe" style="--left:12%; --top:88%; --w:27px; --op:0.038; --dur:30s; --delay:-17s; --rot:10deg;  --dx:8px; --dy:-46px;"><svg><use href="#syringeShape"/></svg></div>
    </div>

    <!-- HEADER / HERO SLIDER -->
    <header class="hero">
      <div class="hero-slider" id="heroSlider">
        <img class="hero-photo slide is-active" src="main1.jpg" alt="dr. peach aesthetic medicine">
        <img class="hero-photo slide" src="main2.jpg" alt="dr. peach aesthetic medicine">
        <img class="hero-photo slide" src="main3.jpg" alt="dr. peach aesthetic medicine">
      </div>
      <div class="hero-veil"></div>
      <div class="hero-text">
        <h1 class="brand">dr.&nbsp;peach</h1>
        <p class="brand-sub">Aesthetic&nbsp;Medicine</p>
      </div>
    </header>

    <!-- PRICE LIST (rendered dynamically from Google Sheet) -->
    <main class="price">

      <div id="pricelist-container">
        <p class="pricelist-loading">Завантаження прайсу…</p>
      </div>

      <p class="disclaimer">Ціни дійсні на момент консультації.<br>Остаточну вартість визначає лікар індивідуально.</p>

      <div class="cta-group">
        <a class="cta cta-primary" href="https://ig.me/m/dr.peach_cosmetologist" target="_blank" rel="noopener">
          <span>Записатися</span>
        </a>
        <a class="cta cta-secondary" href="https://instagram.com/dr.peach_cosmetologist" target="_blank" rel="noopener">
          <svg class="ig-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5.5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17.1" cy="6.9" r="1.1" fill="currentColor"/>
          </svg>
          <span>Повернутися в Instagram</span>
        </a>
      </div>

    </main>

    <footer class="app-footer">
      <span>dr. peach</span> · aesthetic medicine studio
    </footer>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
